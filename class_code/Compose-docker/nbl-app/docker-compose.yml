version: '3.8'
services:
  db:
    image: postgres:14.17-bookworm
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data1:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=123456
      - POSTGRES_USER=mama
      - POSTGRES_DB=netbl_db
    ports:
      - 5432:5432
    networks:
      - nbl-net

  backend:
    build:
      context: ./nbl-backend
      dockerfile: Dockerfile
    container_name: nbl-backend
    depends_on:
      - db
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=mama
      - DB_PASSWORD=123456
    ports:
      - 5002:5000
    networks:
      - nbl-net

  frontend:
    build:
      context: ./nbl
      dockerfile: Dockerfile
    container_name: nbl-frontend
    restart: always
    depends_on:
     - backend
    ports:
     - 3000:3000
    environment:
     - REACT_APP_API_URL=http://localhost:5002/api

networks:
  nbl-net:

volumes:
  postgres_data1: