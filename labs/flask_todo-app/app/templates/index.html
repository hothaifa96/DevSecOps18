{% extends 'base.html' %}

{% block title %}Todo List{% endblock %}

{% block content %}
<section class="todo-form">
    <h2>Add New Todo</h2>
    <form action="{{ url_for('create_todo') }}" method="POST">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>
        </div>
        <button type="submit">Add Todo</button>
    </form>
</section>

<section class="todo-list">
    <h2>My Todos</h2>
    {% if todos %}
    <ul>
        {% for todo in todos %}
        <li class="todo-item {% if todo.completed %}completed{% endif %}">
            <h3><a href="{{ url_for('view_todo', id=todo.id) }}">{{ todo.title }}</a></h3>
            <p>{{ todo.description }}</p>
            <div class="todo-actions">
                <form action="{{ url_for('toggle_todo', id=todo.id) }}" method="POST">
                    <button type="submit">
                        {% if todo.completed %}Mark Incomplete{% else %}Mark Complete{% endif %}
                    </button>
                </form>
                <form action="{{ url_for('delete_todo', id=todo.id) }}" method="POST">
                    <button type="submit" class="delete">Delete</button>
                </form>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No todos yet. Add one above!</p>
    {% endif %}
</section>
{% endblock %}
